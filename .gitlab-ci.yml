stages:
  - release

workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^release-oss-v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9]+(\.[a-z0-9]+)*)?$/ && $CI_COMMIT_REF_PROTECTED == "true"'
    - when: never

release:
  tags:
    - cloudcare-tools
  stage: release
  resource_group: rumable-oss-release
  interruptible: false
  timeout: 1h
  variables:
    GIT_DEPTH: "0"
  script:
    - bash scripts/ci/run-ci.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - release-report.json
      - dist/
