schemaVersion = 1

[[sites]]
id = "apache-otel"
publicURL = "http://www.example.com/"
probePaths = ["/"]
includePaths = ["/"]

[sites.apache]
binary = "/usr/sbin/apache2ctl"

[sites.rum]
enabled = false

[sites.otel]
enabled = true
backend = "datakit"
endpoint = "http://127.0.0.1:4317"
serviceName = "apache"
# Build the isolated module with scripts/build-apache-otel.sh first.
# Install the SDK libraries on the Apache service's loader path too.
modulePath = "/opt/otel/WebServerModule/Apache/libmod_apache_otel.so"
sampleRate = 100 # Native Apache sampler accepts only 0 or 100.
excludePaths = ["/health"]
# Dataway uses the same Collector fields as otel-nginx.toml.
