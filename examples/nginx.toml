schemaVersion = 1

[[sites]]
id = "website"
publicURL = "https://www.example.com/"
probePaths = ["/", "/login"]
includePaths = ["/"]
excludePaths = ["/api/", "/downloads/"]

[sites.nginx]
binary = "/usr/sbin/nginx"
args = ["-c", "/etc/nginx/nginx.conf"]
attachmentReviewed = false

[sites.sdk]
source = "bundled" # bundled（网站同域）或 cdn
loading = "async" # sync 会阻塞 HTML 解析；需要支持同步加载的新版本
# url = "https://static.guance.com/browser-sdk/v3/dataflux-rum.js"
integrity = false # 仅 CDN 可开启，跨域时需要 CORS

[sites.rum]
applicationId = "REPLACE_APPLICATION_ID"
site = "https://REPLACE_OPENWAY_HOST"
clientToken = "REPLACE_CLIENT_TOKEN"
env = "production"
service = "browser"
version = "1.0.0"
sessionSampleRate = 100
