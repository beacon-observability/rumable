events {}
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 18874;
        server_name 127.0.0.1;
        location / {
            proxy_pass http://web:3000;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
