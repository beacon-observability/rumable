schemaVersion = 1

[[sites]]
id = "apache-example"
publicURL = "https://www.example.com/"
probePaths = ["/", "/index.html"]
includePaths = ["/"]
excludePaths = ["/api/", "/downloads/", "/assets/"]

[sites.apache]
# Debian/Ubuntu: apache2ctl retains the distribution's envvars.
binary = "/usr/sbin/apache2ctl"
# Native httpd example: binary = "/usr/sbin/httpd"
# args = ["-f", "/etc/httpd/conf/httpd.conf"]
attachmentReviewed = false

[sites.rum]
applicationId = "REPLACE_APPLICATION_ID"
site = "https://REPLACE_OPENWAY_HOST"
clientToken = "REPLACE_CLIENT_TOKEN"
env = "production"
service = "browser"
version = "1.0.0"
sessionSampleRate = 100
sessionReplayEnabled = false
sessionReplaySampleRate = 100
defaultPrivacyLevel = "mask"
trackUserInteractions = true
compressIntakeRequests = false
allowedTracingUrls = []
