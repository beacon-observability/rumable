schemaVersion = 1

[[sites]]
id = "nginx-otel"
publicURL = "http://www.example.com/"
probePaths = ["/"]
includePaths = ["/"]

[sites.nginx]
binary = "/usr/sbin/nginx"

[sites.rum]
enabled = false # OTel-only: browser credentials are not needed.

[sites.otel]
enabled = true
backend = "datakit"
endpoint = "http://127.0.0.1:4317"
serviceName = "nginx"
modulePath = "/usr/lib/nginx/modules/ngx_otel_module.so"
sampleRate = 100
includePaths = ["/"]
excludePaths = ["/health"]
# For Dataway 1.17.0+, replace backend/endpoint and uncomment these fields.
# backend = "dataway"
# endpoint = "https://dataway.example.com/otel"
# collectorEndpoint = "http://127.0.0.1:4317"
# tokenEnv = "RUMABLE_DATAWAY_TOKEN"
